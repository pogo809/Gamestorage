<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Zone Shift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed canvas world. The zone-briefing board (map cards) is the main control surface;
   the editor and touch controls are thin overlays. One deliberate dark look, so the page stays single-theme. */
:root{
  color-scheme:dark;
  --bg:#080b10;
  --panel:rgba(14,19,29,.93);
  --bg-panel:#0e131d;
  --raise:#18212f;
  --raise-2:#222e42;
  --line:rgba(176,198,228,.17);
  --text:#e8edf5;
  --dim:#97a4ba;
  --amber:#ffb224;
  --amber-ink:#1c1200;
  --teal:#2ec4b6;
  --red:#ff5468;
  --f-display:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--f-body);overflow:hidden;position:relative;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;background:var(--bg)}
body[data-state="playing"] #game{cursor:none}
body[data-state="editor"] #game{cursor:crosshair}
#safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

/* ---------- briefing overlay ---------- */
.overlay{position:absolute;inset:0;display:grid;place-items:center;overflow:auto;touch-action:pan-y;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at 50% 35%,rgba(7,10,15,.5),rgba(4,6,10,.88))}
.panel{width:min(1000px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:18px;
  padding:22px 22px 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 24px 80px rgba(0,0,0,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ph{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.ph>div{min-width:0}
.eyebrow{margin:0;font:600 12px var(--f-display);letter-spacing:.22em;text-transform:uppercase;color:var(--amber)}
h1{margin:6px 0 8px;font:700 clamp(32px,7vw,54px)/1 var(--f-display);letter-spacing:.07em;text-transform:uppercase;text-wrap:balance}
.sub{margin:0;color:var(--dim);max-width:60ch}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:8px;padding:6px 11px;font:600 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);background:var(--raise)}
.chip b{color:var(--text);font-size:15px;letter-spacing:.02em;margin-left:6px;font-variant-numeric:tabular-nums}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
h2{margin:0;font:600 13px var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.hint{font-size:13px;color:var(--dim)}

.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:12px}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:9px;padding:8px 8px 11px;
  border:1px solid var(--line);border-radius:10px;background:var(--raise);transition:border-color .15s,background .15s}
.card:hover{border-color:rgba(255,178,36,.55);background:var(--raise-2)}
.card:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.card[aria-pressed="true"]{border-color:var(--amber);background:var(--raise-2);box-shadow:inset 0 0 0 1px var(--amber)}
.thumb{aspect-ratio:16/10;border-radius:6px;overflow:hidden;background:#05070b;display:block}
.thumb canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block}
.card .meta{display:flex;flex-direction:column;gap:2px;padding:0 3px;min-width:0}
.card .nm{font:600 15px var(--f-display);letter-spacing:.03em;overflow-wrap:anywhere}
.card .tg{font-size:12.5px;color:var(--dim)}
.card[aria-pressed="true"] .tg{color:var(--text)}
.card.empty .thumb{display:grid;place-items:center;border:1px dashed var(--line);background:transparent;color:var(--dim);font:500 13px var(--f-display);text-align:center;padding:8px}

.opts{display:flex;gap:12px 28px;flex-wrap:wrap;align-items:center}
.opt{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lbl{font:600 12px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--raise)}
.seg button{all:unset;cursor:pointer;padding:7px 12px;font:600 13px var(--f-display);letter-spacing:.04em;color:var(--dim);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button:hover{color:var(--text)}
.seg button:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
.seg button[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink)}
.keys{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--dim);font-size:13px}
.keys span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
kbd{font:600 12px var(--f-display);padding:2px 7px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--raise);color:var(--text)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;align-items:center;position:sticky;bottom:0;padding:12px 0 20px;
  background:linear-gradient(to top,var(--bg-panel) 80%,transparent)}
.actions .grow{flex:1 1 200px;font-size:13px;color:var(--dim);min-width:0}
.btn{cursor:pointer;font:600 14px var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:11px 18px;border-radius:8px;
  border:1px solid var(--line);background:var(--raise);color:var(--text);transition:filter .15s,background .15s,border-color .15s}
.btn:hover{background:var(--raise-2);border-color:rgba(176,198,228,.34)}
.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--amber)}
.btn.small{padding:8px 12px;font-size:12.5px}

/* ---------- map editor ---------- */
.editor{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;gap:8px;
  padding-block:8px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.ed-top,.ed-bottom{pointer-events:auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 10px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ed-bottom{justify-content:space-between}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tool{cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--raise);
  font:600 12.5px var(--f-display);letter-spacing:.04em}
.tool i{width:14px;height:14px;border-radius:3px;border:1px solid rgba(255,255,255,.35);display:inline-block}
.tool[aria-pressed="true"]{border-color:var(--amber);background:var(--raise-2);box-shadow:inset 0 0 0 1px var(--amber)}
.tool:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.ed-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:500 14px var(--f-body);color:var(--text);min-width:0;-webkit-user-select:text;user-select:text}
.field:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
input.field{width:min(190px,100%)}
.sel{display:inline-flex;align-items:center;gap:8px;font:600 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.ed-help{font-size:12.5px;color:var(--dim)}

/* ---------- touch controls ---------- */
.touch{position:absolute;inset:0;pointer-events:none}
.tcol{position:absolute;display:flex;flex-direction:column;gap:10px;top:calc(150px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
.tbtn{pointer-events:auto;touch-action:none;width:56px;height:56px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);background:rgba(14,19,29,.55);
  color:var(--text);font:700 11px var(--f-display);letter-spacing:.06em;display:grid;place-items:center;padding:0}
.tbtn:active{background:rgba(255,178,36,.5)}
.tbtn.small{width:44px;height:44px}
.tcol .small{align-self:flex-end;margin-right:6px}

#toast{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);max-width:calc(100% - 32px);padding:9px 16px;border-radius:9px;
  background:rgba(10,14,22,.94);border:1px solid var(--line);font:600 13px var(--f-display);letter-spacing:.04em;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-height:520px) and (orientation:landscape){
  .tcol{top:auto;right:auto;left:50%;transform:translateX(-50%);flex-direction:row;gap:8px;bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .tbtn{width:50px;height:50px;font-size:10px}
  .tcol .small{align-self:center;margin:0;width:42px;height:42px}
}
@media (max-width:560px){
  .panel{padding:16px 16px 0;gap:16px}
  .actions .btn{flex:1 1 auto}
  .maps{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<canvas id="game" tabindex="0" aria-label="Zone Shift game view"></canvas>
<div id="safe" aria-hidden="true"></div>

<div id="overlay" class="overlay" hidden>
  <div class="panel" role="dialog" aria-labelledby="ov-title">
    <header class="ph">
      <div>
        <p class="eyebrow" id="ov-eyebrow">Top-down shooter</p>

    </header>

    <section aria-labelledby="h-maps">

          <button type="button" data-v="1" aria-pressed="false">Every wave</button>
          <button type="button" data-v="3" aria-pressed="false">Every 3 waves</button>
        </div>
      </div>
      <div class="opt"><span class="lbl" id="l-snd">Sound</span>
        <div class="seg" id="seg-snd" role="group" aria-labelledby="l-snd">
          <button type="button" data-v="on" aria-pressed="true">On</button>
          <button type="button" data-v="off" aria-pressed="false">Off</button>
        </div>
      </div>
    </section>

    <div class="keys" id="keys"></div>

    <footer class="actions">
      <span class="grow" id="act-note"></span>

      <button type="button" class="btn" id="btn-restart" hidden>Restart run</button>
      <button type="button" class="btn primary" id="btn-main">Start run</button>

  </div>
</div>

<div id="editor" class="editor" hidden>
  <div class="ed-top">
    <button type="button" class="btn small" id="ed-back">&larr; Back</button>
    <input id="ed-name" class="field" maxlength="24" value="My zone" aria-label="Zone name" autocomplete="off">
    <label class="sel" for="ed-theme">Look <select id="ed-theme" class="field"></select></label>
    <div class="opt"><span class="lbl" id="l-size">Size</span>
      <div class="seg" id="ed-size" role="group" aria-labelledby="l-size">
        <button type="button" data-s="S" aria-pressed="false">S</button>
        <button type="button" data-s="M" aria-pressed="true">M</button>
        <button type="button" data-s="L" aria-pressed="false">L</button>
      </div>
    </div>
    <div class="opt"><span class="lbl" id="l-brush">Brush</span>
      <div class="seg" id="ed-brush" role="group" aria-labelledby="l-brush">
        <button type="button" data-b="1" aria-pressed="true">1</button>
        <button type="button" data-b="2" aria-pressed="false">2</button>
        <button type="button" data-b="3" aria-pressed="false">3</button>
      </div>
    </div>
    <span class="ed-help">Drag to paint, right-drag to erase.</span>
  </div>
  <div class="ed-bottom">
    <div class="tools" id="ed-tools" role="group" aria-label="Tiles"></div>
    <div class="ed-actions">
      <button type="button" class="btn small" id="ed-random">Randomize</button>
      <button type="button" class="btn small" id="ed-clear">Clear</button>
      <label class="sel" for="ed-slot">Slot <select id="ed-slot" class="field">
        <option value="0">Custom 1</option><option value="1">Custom 2</option><option value="2">Custom 3</option></select></label>
      <button type="button" class="btn small" id="ed-save">Save</button>
      <button type="button" class="btn small primary" id="ed-test">Test play</button>
    </div>
  </div>
</div>

<div id="touch" class="touch" hidden>
  <div class="tcol">
    <button type="button" class="tbtn small" id="tb-pause" aria-label="Pause">II</button>
    <button type="button" class="tbtn" id="tb-dash">DASH</button>
    <button type="button" class="tbtn" id="tb-reload">RELOAD</button>
    <button type="button" class="tbtn" id="tb-swap">GUN</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ===================== core helpers, storage, audio, input state ===================== */
const TAU = Math.PI * 2, T = 32;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU; return d; }
function hash2(x, y, s) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul((s | 0) + 1, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const $ = id => document.getElementById(id);

/* storage: per-viewer conveniences only (custom zones, best score, options); always falls back to memory */
const mem = {};
function loadKey(k, def) { try { const s = localStorage.getItem(k); if (s !== null) return JSON.parse(s); } catch (e) { } return k in mem ? mem[k] : def; }
function saveKey(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }

/* ---------- synthesized sound ---------- */
const Sfx = (() => {
  let ac = null, master = null, nbuf = null, muted = false; const last = {};
  function init() {
    if (ac) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ac = new AC(); master = ac.createGain(); master.gain.value = 0.3; master.connect(ac.destination);
      nbuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  function ok(name, gap) {
    if (!ac || muted || ac.state !== 'running') return false;
    const n = performance.now(); if (last[name] && n - last[name] < gap) return false; last[name] = n; return true;
  }
  function noise(dur, f0, f1, vol, type, q) {
    const t = ac.currentTime, s = ac.createBufferSource(); s.buffer = nbuf; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = type || 'lowpass'; f.Q.value = q || 0.8;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
  }
  function tone(f0, f1, dur, vol, type, delay) {
    const t = ac.currentTime + (delay || 0), o = ac.createOscillator(); o.type = type || 'square';
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
  }
  return {
    resume() { init(); if (ac && ac.state === 'suspended') ac.resume(); },
    get muted() { return muted; },
    setMuted(v) { muted = !!v; },
    shoot(id) {
      if (!ok('sh' + id, id === 'smg' ? 45 : 70)) return;
      if (id === 'pistol') { noise(.09, 3600, 700, .5, 'bandpass'); tone(240, 60, .08, .22, 'square'); }
      else if (id === 'smg') { noise(.06, 3200, 600, .34, 'bandpass'); tone(190, 70, .05, .13, 'square'); }
      else if (id === 'shotgun') { noise(.28, 2600, 180, .85); tone(120, 40, .22, .4, 'sawtooth'); }
      else { noise(.2, 4200, 300, .6, 'bandpass'); tone(320, 50, .16, .32, 'sawtooth'); }
    },
    enemyShot() { if (ok('es', 80)) tone(720, 260, .1, .1, 'sawtooth'); },
    hit() { if (ok('hit', 35)) tone(520, 200, .05, .1, 'triangle'); },
    kill() { if (ok('kill', 40)) { noise(.14, 1300, 200, .32); tone(170, 50, .12, .18, 'square'); } },
    boom() { if (ok('boom', 60)) { noise(.7, 1900, 60, 1, 'lowpass'); tone(95, 28, .55, .55, 'sine'); } },
    hurt() { if (ok('hurt', 120)) { tone(210, 70, .2, .28, 'sawtooth'); noise(.12, 900, 200, .3); } },
    reload() { if (!ac || muted || ac.state !== 'running') return; tone(900, 500, .04, .13, 'square'); tone(600, 900, .05, .13, 'square', .15); },
    empty() { if (ok('empty', 200)) tone(1300, 1000, .03, .1, 'square'); },
    pickup() { if (ok('pick', 80)) { tone(620, 1250, .1, .16, 'sine'); tone(900, 1700, .1, .1, 'sine', .07); } },
    dash() { if (ok('dash', 100)) noise(.2, 500, 3200, .28, 'bandpass', 1.4); },
    wave() { if (ok('wave', 300)) { tone(330, 330, .12, .16, 'square'); tone(440, 440, .12, .16, 'square', .12); tone(660, 660, .2, .18, 'square', .24); } },
    swap() { if (ok('swap', 200)) { noise(.35, 300, 2400, .35, 'bandpass', 1.2); tone(180, 520, .3, .12, 'sawtooth'); } },
    ui() { if (ok('ui', 50)) tone(760, 980, .05, .1, 'square'); },
    over() { if (ok('over', 500)) { tone(300, 60, .9, .3, 'sawtooth'); noise(.8, 700, 80, .35); } },
  };
})();

/* ---------- shared input state ---------- */
const Input = {
  keys: Object.create(null), pressed: Object.create(null),
  mx: 0, my: 0, mdown: false, touch: false,
  mv: { x: 0, y: 0 }, av: { x: 0, y: 0, on: false, mag: 0 },
  sticks: { move: null, aim: null },
};

/* ===================== tiles, themes, handcrafted maps, generator, tile painter ===================== */
const TILE = { FLOOR: 0, WALL: 1, CRATE: 2, BARREL: 3, LIQUID: 4, ICE: 5 };
const CH_TO_T = { '.': 0, '#': 1, 'b': 2, 'x': 3, '~': 4, ':': 5, 'P': 0, 'e': 0 };
const T_TO_CH = ['.', '#', 'b', 'x', '~', ':'];
const isSolidT = t => t === 1 || t === 2 || t === 3;

const THEMES = {

/* paints tiles in [x0,x1) x [y0,y1); g needs w,h,t and optional hp */

const cv = $('game'), ctx = cv.getContext('2d');

/* ---------- world ---------- */
function drawWorld(ts, showEntities) {
  const th = L.theme, z = Cam.zoom, cx = Cam.x + Cam.sx, cy = Cam.y + Cam.sy, vw = VW / z, vh = VH / z;
  ctx.save(); ctx.translate(VW / 2, VH / 2); ctx.scale(z, z); ctx.translate(-cx, -cy);

  if (ex > sx && ey > sy) { ctx.drawImage(L.bg, sx, sy, ex - sx, ey - sy, sx, sy, ex - sx, ey - sy); ctx.drawImage(L.decal, sx, sy, ex - sx, ey - sy, sx, sy, ex - sx, ey - sy); }

    const tt = ts / 1000; ctx.strokeStyle = th.liquid[1]; ctx.globalAlpha = .5; ctx.lineWidth = 1.5; ctx.beginPath();
    for (const i of L.liquid) {
      if (L.t[i] !== 4) continue; const tx = i % L.w, ty = (i / L.w) | 0, px = tx * T, py = ty * T;
      if (px < sx - T || px > ex || py < sy - T || py > ey) continue;

    for (const e of list) drawEnemy(e);
    drawPlayer();
    drawBullets(); drawParticles(); drawFlashes();
    for (const f of floaters) { const k = clamp(f.t / 1.1, 0, 1); ctx.globalAlpha = 1 - k * k; text(f.txt, f.x, f.y - k * 26, 13, f.col, 700, 'center'); }

}

  ctx.fillStyle = 'rgba(0,0,0,.55)'; rr(L0, hy, hbW, hbH, 4 * u); ctx.fill();

function drawCrosshair() {

function drawBannerAndFade() {
  if (banner) {
    const k = banner.t / banner.dur, a = k < .12 ? k / .12 : k > .75 ? (1 - k) / .25 : 1, u = clamp(Math.min(VW, VH) / 640, .8, 1.3), y = VH * .3 + (1 - clamp(k * 8, 0, 1)) * 14;
    ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);

function render(ts) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#080b10'; ctx.fillRect(0, 0, VW, VH);
  if (state === 'editor') { renderEditor(); return; }
  if (!L) return;
  const playing = state === 'playing' || state === 'paused' || state === 'over';
  if (state === 'menu') menuCamera(ts);
  Cam.sx = playing ? (Math.random() * 2 - 1) * shakeAmt : 0; Cam.sy = playing ? (Math.random() * 2 - 1) * shakeAmt : 0;
  drawWorld(ts, playing);
  ctx.fillStyle = L.theme.fog; ctx.fillRect(0, 0, VW, VH);
  if (vignette) { ctx.globalAlpha = state === 'menu' ? .8 : .55; ctx.drawImage(vignette, 0, 0, VW, VH); ctx.globalAlpha = 1; }
  if (playing) {
    if (P.hp < 35 && !P.dead) { const pu = .5 + .5 * Math.sin(ts / 200); ctx.fillStyle = 'rgba(255,40,70,' + (.07 + .09 * pu * (1 - P.hp / 35)) + ')'; ctx.fillRect(0, 0, VW, VH); }
    if (P.hurt > 0) { ctx.fillStyle = 'rgba(255,30,60,' + P.hurt * .35 + ')'; ctx.fillRect(0, 0, VW, VH); }
    if (P.dead) { ctx.fillStyle = 'rgba(80,0,10,' + clamp(deadT * .4, 0, .5) + ')'; ctx.fillRect(0, 0, VW, VH); }

}

const ED = { g: null, theme: 'warehouse', tool: '#', brush: 1, cell: 12, ox: 0, oy: 0, bg: document.createElement('canvas'), dirty: true, painting: false, erase: false, last: null, hover: null, ret: 'title', slot: 0, savedId: null, topEl: null, botEl: null };
const EDTOOLS = [
  { k: '#', label: 'Wall', col: '#9aa6b3' }, { k: '.', label: 'Floor', col: '#4a525c' }, { k: 'b', label: 'Crate', col: '#b98a4a' }, { k: 'x', label: 'Barrel', col: '#c9432f' },
  { k: '~', label: 'Slow', col: '#3a9fb5' }, { k: ':', label: 'Ice', col: '#a7dbf3' }, { k: 'P', label: 'Player', col: '#2ec4b6' }, { k: 'e', label: 'Enemy spawn', col: '#ff5468' },
];
const firstEmptySlot = () => { const i = Customs.findIndex(c => !c); return i < 0 ? 0 : i; };
function openEditor(def) {
  ED.ret = menuMode; ED.savedId = null;
  let g, theme, name, slot;
  if (def && !def.empty) { g = cloneGrid(defGrid(def)); theme = def.theme; name = def.custom ? def.name : def.name + ' copy'; slot = def.custom ? def.slot : firstEmptySlot(); }
  else { g = blankGrid(44, 30); theme = 'desert'; name = 'My zone'; slot = def && def.empty ? def.slot : firstEmptySlot(); }
  ED.g = g; ED.theme = theme; ED.slot = slot; ED.dirty = true; ED.hover = null; ED.painting = false;
  $('ed-name').value = name; $('ed-theme').value = theme; $('ed-slot').value = String(slot); edSyncSeg();
  hideOverlay(); $('editor').hidden = false; state = 'editor';
}
function edSyncSeg() {
  for (const b of $('ed-size').children) { const s = SIZES[b.dataset.s]; b.setAttribute('aria-pressed', String(ED.g.w === s[0] && ED.g.h === s[1])); }
  for (const b of $('ed-brush').children) b.setAttribute('aria-pressed', String(+b.dataset.b === ED.brush));
  for (const b of $('ed-tools').children) b.setAttribute('aria-pressed', String(b.dataset.k === ED.tool));
}
function edResize(key) {
  const [w, h] = SIZES[key], o = ED.g, n = blankGrid(w, h);
  for (let y = 1; y < Math.min(h, o.h) - 1; y++) for (let x = 1; x < Math.min(w, o.w) - 1; x++) n.t[y * w + x] = o.t[y * o.w + x];
  const inside = p => p.x > 0 && p.y > 0 && p.x < w - 1 && p.y < h - 1;
  n.E = o.E.filter(inside); n.P = inside(o.P) ? { x: o.P.x, y: o.P.y } : { x: w >> 1, y: h >> 1 }; n.t[n.P.y * w + n.P.x] = 0;
  ED.g = n; ED.dirty = true; edSyncSeg();
}
function edSet(x, y, k) {
  const g = ED.g, i = y * g.w + x;
  if (k === 'P') { g.t[i] = 0; g.E = g.E.filter(e => !(e.x === x && e.y === y)); g.P = { x, y }; return; }
  if (k === 'e') { if (isSolidT(g.t[i])) g.t[i] = 0; if (g.P.x === x && g.P.y === y) return; if (!g.E.some(e => e.x === x && e.y === y)) g.E.push({ x, y }); return; }
  const code = CH_TO_T[k] || 0;
  if (g.P.x === x && g.P.y === y && isSolidT(code)) return;
  g.t[i] = code;
  if (isSolidT(code) || k === '.') g.E = g.E.filter(e => !(e.x === x && e.y === y));
}
function edPaint(cx, cy, erase) {
  const g = ED.g, k = erase ? '.' : ED.tool, b = (k === 'P' || k === 'e') ? 1 : ED.brush, off = Math.floor((b - 1) / 2);
  for (let j = 0; j < b; j++) for (let i = 0; i < b; i++) { const x = cx - off + i, y = cy - off + j; if (x >= 0 && y >= 0 && x < g.w && y < g.h) edSet(x, y, k); }
  ED.dirty = true;
}
function edCell(e) { const r = cv.getBoundingClientRect(); return { x: Math.floor((e.clientX - r.left - ED.ox) / ED.cell), y: Math.floor((e.clientY - r.top - ED.oy) / ED.cell) }; }
function edStroke(a, b, erase) {
  let { x: x0, y: y0 } = a; const dx = Math.abs(b.x - x0), dy = Math.abs(b.y - y0), sx = x0 < b.x ? 1 : -1, sy = y0 < b.y ? 1 : -1; let err = dx - dy;
  for (let n = 0; n < 400; n++) { edPaint(x0, y0, erase); if (x0 === b.x && y0 === b.y) break; const e2 = 2 * err; if (e2 > -dy) { err -= dy; x0 += sx; } if (e2 < dx) { err += dx; y0 += sy; } }
}
function edDown(e) {
  e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) { }
  const c = edCell(e); ED.painting = true; ED.erase = e.button === 2; ED.last = c; edPaint(c.x, c.y, ED.erase);
}
function edMove(e) { const c = edCell(e); ED.hover = c; if (ED.painting) { edStroke(ED.last, c, ED.erase); ED.last = c; } }
function edUp() { ED.painting = false; ED.last = null; }
function edBack() {
  $('editor').hidden = true; const r = ED.ret, sv = ED.savedId;
  openMenu(r === 'pause' ? 'pause' : r === 'over' ? 'over' : 'title', false);
  if (sv && findMap(sv)) { selId = sv; buildCards(); updateMain(); if (menuMode === 'title') loadLevel(findMap(sv)); }
}
function edDef(id) { return { id, name: $('ed-name').value.trim() || 'My zone', theme: ED.theme, rows: gridToRows(ED.g), tags: ['Custom'], custom: true }; }
function edSave() {
  let open = 0; for (let i = 0; i < ED.g.t.length; i++) if (!isSolidT(ED.g.t[i])) open++;
  if (open < 60) { toast('Open up more floor first. Zones need at least 60 open tiles.'); return; }
  const d = edDef('x'), slot = +$('ed-slot').value;
  Customs[slot] = { name: d.name, theme: d.theme, rows: d.rows }; saveKey('zs.custom', Customs); rebuildCustomDefs();
  ED.slot = slot; ED.savedId = 'custom' + slot; toast('Saved to Custom ' + (slot + 1));
}
function edTest() {
  let open = 0; for (let i = 0; i < ED.g.t.length; i++) if (!isSolidT(ED.g.t[i])) open++;
  if (open < 60) { toast('Open up more floor first. Zones need at least 60 open tiles.'); return; }
  const def = edDef('custom-test'); $('editor').hidden = true; startRun(def); cv.focus({ preventScroll: true });
}
function renderEditor() {
  const g = ED.g; if (!g) return;
  const th = THEMES[ED.theme];
  if (ED.dirty) { ED.bg.width = g.w * T; ED.bg.height = g.h * T; const c = ED.bg.getContext('2d'); c.fillStyle = th.void; c.fillRect(0, 0, ED.bg.width, ED.bg.height); drawTiles(c, g, th, 0, 0, g.w, g.h); ED.dirty = false; }
  const cr = cv.getBoundingClientRect(), tb = ED.topEl.getBoundingClientRect(), bb = ED.botEl.getBoundingClientRect();
  const x0 = 8 + inset.l, x1 = VW - 8 - inset.r, y0 = tb.bottom - cr.top + 8, y1 = bb.top - cr.top - 8, aw = x1 - x0, ah = y1 - y0;
  const cell = Math.max(3, Math.floor(Math.min(aw / g.w, ah / g.h))); ED.cell = cell;
  ED.ox = x0 + (aw - g.w * cell) / 2; ED.oy = y0 + (ah - g.h * cell) / 2;
  ctx.imageSmoothingQuality = 'high'; ctx.drawImage(ED.bg, ED.ox, ED.oy, g.w * cell, g.h * cell);
  if (cell >= 9) { ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1; ctx.beginPath(); for (let x = 0; x <= g.w; x++) { ctx.moveTo(ED.ox + x * cell + .5, ED.oy); ctx.lineTo(ED.ox + x * cell + .5, ED.oy + g.h * cell); } for (let y = 0; y <= g.h; y++) { ctx.moveTo(ED.ox, ED.oy + y * cell + .5); ctx.lineTo(ED.ox + g.w * cell, ED.oy + y * cell + .5); } ctx.stroke(); }
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.5; ctx.strokeRect(ED.ox - .5, ED.oy - .5, g.w * cell + 1, g.h * cell + 1);
  for (const e of g.E) { ctx.fillStyle = 'rgba(255,84,104,.92)'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(ED.ox + (e.x + .5) * cell, ED.oy + (e.y + .5) * cell, cell * .34, 0, TAU); ctx.fill(); ctx.stroke(); }
  ctx.fillStyle = '#2ec4b6'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ED.ox + (g.P.x + .5) * cell, ED.oy + (g.P.y + .5) * cell, cell * .42, 0, TAU); ctx.fill(); ctx.stroke();
  if (cell >= 10) text('P', ED.ox + (g.P.x + .5) * cell, ED.oy + (g.P.y + .5) * cell + cell * .22, cell * .6, '#06201d', 700, 'center');
  if (ED.hover) {
    const b = (ED.tool === 'P' || ED.tool === 'e') ? 1 : ED.brush, off = Math.floor((b - 1) / 2);
    ctx.strokeStyle = '#ffb224'; ctx.lineWidth = 2; ctx.strokeRect(ED.ox + (ED.hover.x - off) * cell, ED.oy + (ED.hover.y - off) * cell, b * cell, b * cell);
  }
}
function buildEditorUi() {
  ED.topEl = document.querySelector('.ed-top'); ED.botEl = document.querySelector('.ed-bottom');
  const tools = $('ed-tools');
  EDTOOLS.forEach((t, i) => {
    const b = mk('button', 'tool'); b.type = 'button'; b.dataset.k = t.k; b.title = 'Key ' + (i + 1);
    const sw = document.createElement('i'); sw.style.background = t.col; b.append(sw, document.createTextNode(t.label));
    b.addEventListener('click', () => { ED.tool = t.k; edSyncSeg(); }); tools.appendChild(b);
  });
  const sel = $('ed-theme'); for (const k in THEMES) { const o = document.createElement('option'); o.value = k; o.textContent = THEMES[k].name; sel.appendChild(o); }
  sel.addEventListener('change', () => { ED.theme = sel.value; ED.dirty = true; });
  for (const b of $('ed-size').children) b.addEventListener('click', () => edResize(b.dataset.s));
  for (const b of $('ed-brush').children) b.addEventListener('click', () => { ED.brush = +b.dataset.b; edSyncSeg(); });
  $('ed-back').addEventListener('click', edBack);
  $('ed-save').addEventListener('click', edSave);
  $('ed-test').addEventListener('click', edTest);
  $('ed-clear').addEventListener('click', () => { ED.g = blankGrid(ED.g.w, ED.g.h); ED.dirty = true; });
  $('ed-random').addEventListener('click', () => { const r = genRandom(); ED.g = parseRows(r.rows); ED.theme = r.theme; $('ed-theme').value = r.theme; ED.dirty = true; edSyncSeg(); });
}

/* ---------- input ---------- */
function updateMouse(e) { const r = cv.getBoundingClientRect(); Input.mx = e.clientX - r.left; Input.my = e.clientY - r.top; }
function touchPos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function touchDown(e) {
  if (state !== 'playing') return;
  try { cv.setPointerCapture(e.pointerId); } catch (_) { }
  const p = touchPos(e), S = Input.sticks;
  if (p.x < VW * .5 && !S.move) S.move = { id: e.pointerId, ox: p.x, oy: p.y, dx: 0, dy: 0 };
  else if (p.x >= VW * .5 && !S.aim) S.aim = { id: e.pointerId, ox: p.x, oy: p.y, dx: 0, dy: 0 };
}
function touchMove(e) {
  const p = touchPos(e), S = Input.sticks, R = 54;
  for (const k of ['move', 'aim']) {
    const s = S[k]; if (!s || s.id !== e.pointerId) continue;
    let dx = p.x - s.ox, dy = p.y - s.oy; const l = Math.hypot(dx, dy);
    if (l > R) { dx *= R / l; dy *= R / l; } s.dx = dx; s.dy = dy;
    if (k === 'move') { Input.mv.x = dx / R; Input.mv.y = dy / R; }
    else { Input.av.mag = Math.min(1, l / R); Input.av.on = l > 8; if (l > 8) { Input.av.x = dx / l; Input.av.y = dy / l; } }
  }
}
function touchUp(e) {
  const S = Input.sticks;
  for (const k of ['move', 'aim']) { const s = S[k]; if (s && s.id === e.pointerId) { S[k] = null; if (k === 'move') { Input.mv.x = Input.mv.y = 0; } else { Input.av.on = false; Input.av.mag = 0; } } }
}
let lastWheel = 0;
function bindInput() {
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('pointerdown', e => {
    Sfx.resume();
    if (state === 'editor') { edDown(e); return; }
    if (e.pointerType === 'touch') { Input.touch = true; touchDown(e); return; }
    Input.touch = false; updateMouse(e);
    if (state !== 'playing') return;
    try { cv.setPointerCapture(e.pointerId); } catch (_) { }
    if (e.button === 0) Input.mdown = true; else if (e.button === 2) Input.pressed.Space = true;
  });
  cv.addEventListener('pointermove', e => {
    if (state === 'editor') { edMove(e); return; }
    if (e.pointerType === 'touch') { touchMove(e); return; }
    updateMouse(e); if (Input.touch) { Input.touch = false; Input.sticks.move = Input.sticks.aim = null; Input.mv.x = Input.mv.y = 0; Input.av.on = false; }
  });
  const up = e => {
    if (state === 'editor') { edUp(); return; }
    if (e.pointerType === 'touch') touchUp(e); else if (e.button === 0) Input.mdown = false;
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointerleave', () => { if (state === 'editor') ED.hover = null; });
  cv.addEventListener('wheel', e => {
    if (state !== 'playing') return; e.preventDefault(); const n = performance.now(); if (n - lastWheel < 120) return; lastWheel = n;
    setWeapon((P.w + (e.deltaY > 0 ? 1 : -1) + WEAPONS.length) % WEAPONS.length);
  }, { passive: false });

  window.addEventListener('keydown', e => {
    const tg = e.target, c = e.code;
    if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'SELECT')) { if (c === 'Escape' || c === 'Enter') tg.blur(); return; }
    if (c === 'KeyM' && !e.repeat) { setMuted(!Opts.muted); toast(Opts.muted ? 'Sound off' : 'Sound on'); return; }
    if (state === 'playing') {
      if (c === 'Space' || c.startsWith('Arrow') || c === 'Tab') e.preventDefault();
      Input.keys[c] = true; if (!e.repeat) Input.pressed[c] = true;
      if (!e.repeat) { if (c === 'Escape' || c === 'KeyP') pauseGame(); else if (c === 'BracketRight') quickSwap(1); else if (c === 'BracketLeft') quickSwap(-1); }
    } else if (state === 'paused') {
      if (c === 'Escape' || c === 'KeyP') { e.preventDefault(); resumeGame(); }
      else if (c === 'Enter' && !(tg && tg.tagName === 'BUTTON')) { e.preventDefault(); mainAction(); }
    } else if (state === 'menu' || state === 'over') {
      if (c === 'Enter' && !(tg && tg.tagName === 'BUTTON')) { e.preventDefault(); mainAction(); }
    } else if (state === 'editor') {
      if (c === 'Escape') edBack();

    }

  window.addEventListener('blur', () => { Input.mdown = false; for (const k in Input.keys) Input.keys[k] = false; if (state === 'playing') pauseGame(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'playing') pauseGame(); });
  window.addEventListener('resize', resize);

  $('btn-main').addEventListener('click', mainAction);
  $('btn-edit').addEventListener('click', () => openEditor(selDef()));
  $('btn-restart').addEventListener('click', () => { if (curDef) { hideOverlay(); startRun(curDef); cv.focus({ preventScroll: true }); } });
  for (const b of $('seg-rot').children) b.addEventListener('click', () => { Opts.rotate = +b.dataset.v; saveKey('zs.opts', { rotate: Opts.rotate, muted: Opts.muted }); syncOpts(); Sfx.ui(); });
  for (const b of $('seg-snd').children) b.addEventListener('click', () => { setMuted(b.dataset.v === 'off'); Sfx.resume(); Sfx.ui(); });
  const tbtn = (id, fn) => { const b = $(id); b.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); Sfx.resume(); fn(); }); b.addEventListener('contextmenu', e => e.preventDefault()); };
  tbtn('tb-dash', () => { Input.pressed.Space = true; });
  tbtn('tb-reload', () => { Input.pressed.KeyR = true; });
  tbtn('tb-swap', () => { if (state === 'playing') setWeapon((P.w + 1) % WEAPONS.length); });
  tbtn('tb-pause', pauseGame);
}

/* ---------- main loop ---------- */
let lastTs = 0, loopErr = false;
function frame(ts) {
  requestAnimationFrame(frame);
  const raw = Math.min(.033, Math.max(0, (ts - lastTs) / 1000)); lastTs = ts;
  try {
    if (document.body.dataset.state !== state) document.body.dataset.state = state;
    const showTouch = Input.touch && state === 'playing', tc = $('touch'); if (tc.hidden === showTouch) tc.hidden = !showTouch;
    if (state === 'playing') update(raw);
    Input.pressed = Object.create(null);
    render(ts);
  } catch (err) { if (!loopErr) { loopErr = true; console.error(err); } }
}
function init() {
  Sfx.setMuted(Opts.muted); resize(); bindInput(); buildEditorUi();
  Input.touch = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
  openMenu('title');
  requestAnimationFrame(frame);
}
init();

</script>
